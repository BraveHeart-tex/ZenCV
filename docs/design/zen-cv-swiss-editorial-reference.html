<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>ZenCV - Swiss Editorial Product Prototype</title>
<style>
:root{
  --paper:#f2f1ec;--surface:#faf9f5;--surface-2:#e9e8e2;--ink:#11110f;--muted:#6e6d67;
  --line:#b7b5ae;--soft-line:#d8d6cf;--accent:#e63b2e;--danger:#c5281c;--white:#fff;
  --max:1440px;--pad:clamp(18px,3vw,48px);--font:Arial,Helvetica,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
button,input,a{font:inherit;color:inherit}a{text-decoration:none}button{cursor:pointer}.site{min-height:100vh;overflow:clip}
.wrap{width:min(100%,var(--max));margin-inline:auto;padding-inline:var(--pad)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(12px,1.6vw,24px)}
.micro{font-size:11px;line-height:1.25;letter-spacing:.08em;text-transform:uppercase;font-weight:700}.eyebrow{color:var(--muted);font-size:12px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.progress{position:fixed;z-index:200;top:0;left:0;right:0;height:3px;background:var(--accent);transform-origin:0 50%;pointer-events:none}
.brand{display:inline-flex;align-items:center;gap:10px;width:max-content;font-size:20px;font-weight:800;letter-spacing:-.05em}.brand-mark{width:17px;height:17px;display:grid;grid-template-columns:1fr 1fr;gap:2px;transform:rotate(45deg)}.brand-mark i{display:block;background:var(--ink)}.brand-mark i:nth-child(2){background:var(--accent)}
.btn,.icon-btn{border:1px solid var(--ink);background:transparent;min-height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:0}.btn{padding:0 18px;gap:20px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.btn.dark{background:var(--ink);color:var(--paper)}.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ghost{border-color:var(--line)}.btn.danger{color:var(--danger);border-color:var(--danger)}.icon-btn{width:42px;padding:0}
.header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.header-inner{min-height:68px;display:grid;grid-template-columns:3fr 5fr 4fr;gap:20px;align-items:center}.nav{display:flex;gap:clamp(18px,3vw,42px);align-items:center}.nav a{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;display:inline-flex;gap:8px}.nav small{color:var(--muted);font-size:9px}.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}

/* Landing */
.hero{padding-top:clamp(40px,6vw,96px)}.hero-meta{grid-column:1/4;border-top:5px solid var(--ink);padding-top:10px}.hero-title{grid-column:4/13;margin:0;font-size:clamp(58px,9.2vw,152px);line-height:.84;letter-spacing:-.075em;font-weight:800}.line-mask{display:block;overflow:hidden;padding-bottom:.04em;margin-bottom:-.04em}.title-line{display:block;transform-origin:left bottom}.accent{color:var(--accent)}.hero-copy{grid-column:4/8;margin-top:clamp(38px,5vw,72px);font-size:clamp(18px,1.7vw,25px);line-height:1.2;letter-spacing:-.025em;font-weight:600}.hero-facts{grid-column:9/13;margin-top:clamp(38px,5vw,72px);border-top:1px solid var(--ink)}.fact{display:grid;grid-template-columns:34px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.fact span:first-child{color:var(--accent);font-weight:800}.fact b{text-transform:uppercase}.hero-actions{grid-column:4/13;display:flex;gap:8px;align-items:center;padding:38px 0 54px;flex-wrap:wrap}.hero-actions .push{margin-left:auto;color:var(--muted)}
.hero-showcase{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:linear-gradient(to right,transparent calc(25% - .5px),var(--soft-line) 25%,transparent calc(25% + .5px)),linear-gradient(to right,transparent calc(50% - .5px),var(--soft-line) 50%,transparent calc(50% + .5px)),linear-gradient(to right,transparent calc(75% - .5px),var(--soft-line) 75%,transparent calc(75% + .5px))}
.showcase-inner{min-height:clamp(460px,54vw,760px);position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(12px,1.6vw,24px);padding-top:clamp(34px,5vw,68px);padding-bottom:clamp(34px,5vw,68px)}.showcase-label{grid-column:1/4}.showcase-note{grid-column:1/3;align-self:end;font-size:12px;line-height:1.45;color:var(--muted)}.doc-stage{grid-column:4/13;min-height:520px;position:relative}.paper-card{position:absolute;width:min(31vw,390px);aspect-ratio:700/990;background:#fff;border:1px solid #8f8d86;box-shadow:0 22px 42px rgba(20,20,16,.09);overflow:hidden;transform-origin:center bottom;will-change:transform}.paper-card img{width:100%;height:100%;display:block;object-fit:cover}.paper-a{left:0;top:14%}.paper-b{left:29%;top:0;z-index:2}.paper-c{left:59%;top:18%}
.section{padding:clamp(74px,9vw,140px) 0}.section-no{grid-column:1/3;font-size:clamp(52px,7vw,104px);line-height:.82;font-weight:800;letter-spacing:-.07em;color:var(--accent)}.section-heading{grid-column:4/9;margin:0;font-size:clamp(36px,5.3vw,78px);line-height:.93;letter-spacing:-.055em;font-weight:800}.section-intro{grid-column:10/13;font-size:14px;line-height:1.42;margin:0;align-self:end;color:var(--muted)}.feature-list{grid-column:4/13;margin-top:clamp(50px,7vw,92px);border-top:1px solid var(--ink)}.feature-row{display:grid;grid-template-columns:1fr 4fr 5fr;gap:22px;padding:24px 0 28px;border-bottom:1px solid var(--line)}.feature-index{color:var(--accent);font-size:13px;font-weight:800}.feature-row h3{margin:0;font-size:clamp(21px,2vw,30px);line-height:1.02;letter-spacing:-.035em}.feature-row p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}.privacy-rail{margin-top:clamp(40px,6vw,80px);grid-column:4/13;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);overflow:hidden}.privacy-rail div{min-height:104px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ink)}.privacy-rail div:last-child{border-right:0}.privacy-rail b{font-size:18px}.privacy-rail span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.templates-section{padding-bottom:clamp(70px,9vw,130px);border-top:1px solid var(--ink)}.templates-head{padding-top:clamp(54px,7vw,100px)}.landing-template-grid{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:16px;overflow-x:auto;padding:46px var(--pad) 20px;margin-inline:auto;width:min(100%,calc(var(--max) + 2 * var(--pad)));scroll-snap-type:x mandatory}.template-card{min-width:220px;scroll-snap-align:start;cursor:pointer}.template-image{background:#fff;border:1px solid var(--ink);aspect-ratio:700/990;overflow:hidden;position:relative}.template-image::after{content:"VIEW";position:absolute;z-index:3;right:0;bottom:0;background:var(--accent);color:#fff;padding:8px 10px;font-size:10px;font-weight:800;letter-spacing:.08em}.template-image img{width:100%;height:100%;display:block;object-fit:cover}.template-meta{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-top:12px}.template-meta .n{color:var(--accent);font-weight:800;font-size:12px}.template-meta h3{margin:0;font-size:19px;letter-spacing:-.025em}.template-meta p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.35;text-transform:uppercase;letter-spacing:.05em}
.cta{background:var(--ink);color:var(--paper);padding:clamp(74px,9vw,135px) 0 44px}.cta .section-no{color:var(--accent)}.cta-title{grid-column:4/13;margin:0;font-size:clamp(50px,8vw,128px);line-height:.84;letter-spacing:-.07em;font-weight:800}.cta-bottom{grid-column:4/13;margin-top:56px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-top:1px solid #5c5b57;padding-top:18px}.cta-bottom p{max-width:540px;color:#aaa9a4;margin:0;font-size:15px;line-height:1.55}.cta .btn.dark{background:var(--paper);color:var(--ink);border-color:var(--paper)}.footer{background:var(--ink);color:var(--paper);border-top:1px solid #5c5b57;padding:24px 0 30px}.footer-grid{display:grid;grid-template-columns:3fr 5fr 4fr;gap:20px;align-items:end}.footer p{margin:0;color:#979690;font-size:11px;line-height:1.5}.footer .right{text-align:right}

/* Application shell */
.app-shell{min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr);background:var(--paper)}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--ink);display:flex;flex-direction:column;background:var(--paper);z-index:50}.sidebar-head{padding:22px 20px;border-bottom:1px solid var(--line)}.sidebar-head .brand{font-size:22px}.sidebar-body{padding:24px 14px;display:flex;flex-direction:column;gap:28px;flex:1}.sidebar-label{padding:0 10px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}.side-link{width:100%;min-height:44px;border:0;border-top:1px solid transparent;border-bottom:1px solid transparent;background:transparent;padding:0 10px;display:grid;grid-template-columns:30px 1fr 20px;align-items:center;text-align:left;font-size:13px;font-weight:700}.side-link .idx{font-size:10px;color:var(--muted)}.side-link .arr{text-align:right;color:var(--muted);opacity:0}.side-link.active{border-color:var(--ink);color:var(--ink)}.side-link.active .idx{color:var(--accent)}.side-link.active .arr{opacity:1}.new-resume-side{width:100%;min-height:46px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.sidebar-foot{border-top:1px solid var(--line);padding:14px;display:flex;align-items:center;justify-content:space-between}.sidebar-foot span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.app-main{min-width:0}.app-topbar{height:68px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,3vw,42px);position:sticky;top:0;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);z-index:40}.crumb{display:flex;align-items:center;gap:14px}.crumb .page-num{color:var(--accent);font-size:11px;font-weight:800}.crumb h1{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.06em}.app-status{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.app-content{padding:clamp(28px,4vw,56px);max-width:1500px;margin:0 auto}
.page-intro{display:grid;grid-template-columns:2fr 1fr;gap:40px;align-items:end;padding-bottom:30px;border-bottom:1px solid var(--ink);margin-bottom:32px}.page-intro h2{margin:0;font-size:clamp(38px,5vw,76px);line-height:.9;letter-spacing:-.055em}.page-intro p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:460px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}.search{position:relative;width:min(100%,420px)}.search input{width:100%;height:44px;border:1px solid var(--ink);background:transparent;border-radius:0;padding:0 42px 0 14px;outline:none}.search input:focus{box-shadow:inset 0 -3px 0 var(--accent)}.search .key{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--muted);letter-spacing:.06em;border:1px solid var(--line);padding:4px 5px}
.library-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}.library-head h3{margin:0;font-size:15px}.library-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.link-button{border:0;background:transparent;padding:0 0 3px;border-bottom:1px solid currentColor;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.documents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.document-card{min-height:220px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:transparent;position:relative}.document-card::before{content:"";position:absolute;left:-1px;top:-1px;width:5px;height:5px;background:var(--accent);opacity:0}.document-card:hover::before{opacity:1}.doc-card-top{display:flex;justify-content:space-between;gap:16px}.doc-name{margin:0;font-size:22px;line-height:1.02;letter-spacing:-.035em}.doc-menu{width:34px;height:34px;border:1px solid var(--line);background:transparent}.doc-template{margin-top:10px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.doc-footer{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:end;gap:10px}.doc-footer time{font-size:10px;color:var(--muted);line-height:1.45}.doc-open{border:0;background:transparent;padding:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.empty-search{padding:70px 10px;border-top:1px solid var(--ink);text-align:center;color:var(--muted)}.empty-search strong{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

/* Templates app */
.app-template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px}.app-template-card .template-image{aspect-ratio:700/990}.app-template-card .template-meta{grid-template-columns:32px 1fr}.template-actions{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.template-actions button{border:0;background:transparent;padding:0;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}

/* Settings */
.settings-layout{display:grid;grid-template-columns:220px minmax(0,740px);gap:clamp(40px,7vw,110px);align-items:start}.settings-nav{position:sticky;top:104px;border-top:1px solid var(--ink)}.settings-nav button{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 0;text-align:left;display:grid;grid-template-columns:34px 1fr;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}.settings-nav span:first-child{color:var(--accent)}
.settings-panel{border-top:1px solid var(--ink)}.settings-section{padding:32px 0;border-bottom:1px solid var(--ink);scroll-margin-top:96px}.settings-section-head{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-bottom:26px}.settings-section-head h3{margin:0;font-size:26px;letter-spacing:-.035em}.settings-section-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.setting-row{display:grid;grid-template-columns:1fr auto;gap:32px;padding:18px 0;border-top:1px solid var(--line);align-items:center}.setting-row:first-of-type{border-top:0}.setting-copy strong{display:block;font-size:14px;margin-bottom:4px}.setting-copy span{font-size:12px;color:var(--muted);line-height:1.4}.segmented{display:flex;border:1px solid var(--ink)}.segmented button{min-width:70px;height:38px;border:0;border-right:1px solid var(--ink);background:transparent;font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.05em}.segmented button:last-child{border-right:0}.segmented button.active{background:var(--ink);color:var(--paper)}
.switch{width:44px;height:24px;border:1px solid var(--ink);background:transparent;padding:2px;display:flex;justify-content:flex-start}.switch.on{justify-content:flex-end;background:var(--ink)}.switch i{display:block;width:18px;height:18px;background:var(--ink)}.switch.on i{background:var(--paper)}
.data-actions{display:grid;gap:0;border-top:1px solid var(--line)}.data-action{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}.data-action strong{display:block;font-size:14px;margin-bottom:4px}.data-action p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.danger-box{border:1px solid var(--danger);padding:18px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.danger-box strong{color:var(--danger);display:block;margin-bottom:4px}.danger-box p{margin:0;color:var(--muted);font-size:12px}

/* Modal/toast */
.modal-backdrop{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:24px;background:rgba(15,15,13,.72)}.modal{width:min(900px,92vw);max-height:92vh;border:1px solid var(--ink);background:var(--surface);box-shadow:0 30px 90px rgba(0,0,0,.35)}.modal.small{width:min(540px,92vw)}.modal-top{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid var(--ink);padding:0 14px 0 18px}.modal-top strong{font-size:13px;text-transform:uppercase;letter-spacing:.06em}.modal-close{width:36px;height:36px;border:0;background:transparent;font-size:22px}.modal-body{padding:24px}.preview-body{display:grid;place-items:center;background:#d9d8d2}.preview-body img{display:block;max-width:min(540px,100%);max-height:76vh;border:1px solid #9a9994}.form-field{margin-bottom:18px}.form-field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-bottom:8px}.form-field input{width:100%;height:44px;border:1px solid var(--ink);background:transparent;padding:0 12px;outline:none}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{border:1px solid var(--line);padding:12px;text-align:left;background:transparent}.choice.active{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}.modal-foot{padding:16px 24px;border-top:1px solid var(--ink);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;z-index:180;right:24px;bottom:24px;border:1px solid var(--ink);background:var(--paper);padding:13px 16px;min-width:250px;font-size:12px;font-weight:700;box-shadow:8px 8px 0 color-mix(in srgb,var(--ink) 12%,transparent)}

/* Theme */
[data-theme="dark"]{--paper:#11110f;--surface:#1a1a17;--surface-2:#24231f;--ink:#f1f0ea;--muted:#a6a49c;--line:#484741;--soft-line:#2c2b27}
[data-theme="dark"] .preview-body{background:#2a2925}

/* Responsive */

<style id="refined-swiss-editorial">
/*
  ZenCV art direction:
  85% Swiss Editorial
  10% Japanese minimalism
   5% quiet utilitarianism
*/
:root {
  --paper: #f7f6f1;
  --surface: #fcfbf7;
  --surface-2: #efeee8;
  --ink: #171713;
  --muted: #78766e;
  --line: #d5d2c8;
  --soft-line: #e6e3da;
  --accent: #c94a3b;
  --danger: #b33127;
}

body {
  background: var(--paper);
  letter-spacing: -0.005em;
}

.micro,
.eyebrow,
.app-status,
.sidebar-label,
.doc-template,
.template-meta p,
.settings-nav button,
.link-button {
  letter-spacing: .075em;
}

.progress {
  height: 2px;
  opacity: .82;
}

/* Shared controls: quiet, precise, not stamped */
.btn,
.icon-btn {
  min-height: 40px;
  border-color: var(--line);
  border-radius: 2px;
}

.btn {
  padding-inline: 17px;
  gap: 14px;
  letter-spacing: .035em;
}

.btn.dark {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.btn.red {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.btn.red span {
  color: #f4b4ab;
}

.btn.ghost {
  border-color: var(--line);
  background: color-mix(in srgb, var(--surface) 55%, transparent);
}

.icon-btn {
  background: transparent;
}

/* Landing header */
.header {
  border-bottom-color: var(--soft-line);
  background: color-mix(in srgb, var(--paper) 95%, transparent);
}

.header-inner {
  min-height: 72px;
}

.brand {
  font-size: 19px;
  font-weight: 700;
}

.brand-mark {
  width: 15px;
  height: 15px;
  gap: 2px;
}

.nav a {
  font-weight: 650;
}

/* Hero: typography carries the hierarchy, not boxes */
.hero {
  padding-top: clamp(54px, 7vw, 110px);
}

.hero-meta {
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

.hero-title {
  font-size: clamp(54px, 8.35vw, 132px);
  line-height: .88;
  letter-spacing: -.066em;
  font-weight: 700;
}

.title-line.accent {
  color: var(--ink);
  display: inline-block;
  position: relative;
}

.title-line.accent::after {
  content: "";
  display: inline-block;
  width: clamp(34px, 4.4vw, 66px);
  height: 4px;
  margin-left: .18em;
  vertical-align: .16em;
  background: var(--accent);
}

.hero-copy {
  font-weight: 500;
  line-height: 1.28;
  color: color-mix(in srgb, var(--ink) 86%, var(--muted));
}

.hero-facts {
  border-top-color: var(--line);
}

.fact {
  border-bottom-color: var(--soft-line);
  padding-block: 12px;
}

.fact span:first-child {
  color: var(--muted);
}

.fact b {
  font-weight: 650;
}

.hero-actions {
  padding-top: 34px;
  padding-bottom: 68px;
}

/* Remove the "visible design grid" look */
.hero-showcase {
  border-top-color: var(--soft-line);
  border-bottom-color: var(--soft-line);
  background: var(--surface-2);
}

.showcase-inner {
  min-height: clamp(500px, 54vw, 760px);
}

.paper-card {
  border-color: #d2cfc5;
  box-shadow:
    0 2px 4px rgba(23, 23, 19, .025),
    0 18px 52px rgba(23, 23, 19, .065);
}

/* Section framing becomes typographic rather than poster-like */
.section {
  padding-block: clamp(92px, 10vw, 160px);
}

.section-no {
  grid-column: 1 / 3;
  padding-top: 7px;
  font-size: 11px;
  line-height: 1.2;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--muted);
}

.section-no::before {
  content: "";
  display: block;
  width: 28px;
  height: 2px;
  margin-bottom: 10px;
  background: var(--accent);
}

.section-heading {
  grid-column: 3 / 9;
  font-size: clamp(36px, 4.6vw, 66px);
  line-height: .98;
  letter-spacing: -.048em;
  font-weight: 700;
}

.section-intro {
  grid-column: 9 / 13;
  color: var(--muted);
  line-height: 1.55;
}

.feature-list {
  grid-column: 3 / 13;
  margin-top: clamp(62px, 7vw, 100px);
  border-top-color: var(--line);
}

.feature-row {
  grid-template-columns: .65fr 3.35fr 5fr;
  gap: clamp(16px, 2vw, 30px);
  padding-block: 28px 32px;
  border-bottom-color: var(--line);
}

.feature-index {
  color: var(--muted);
  font-size: 11px;
}

.feature-row h3 {
  font-weight: 650;
  line-height: 1.12;
}

.feature-row p {
  color: var(--muted);
  line-height: 1.65;
}

/* Workflow is an editorial note, not a brutalist box */
.privacy-rail {
  grid-column: 3 / 13;
  margin-top: 56px;
  border: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.privacy-rail div {
  min-height: 112px;
  padding: 20px 22px 18px 0;
  border-right-color: var(--soft-line);
}

.privacy-rail div + div {
  padding-left: 22px;
}

.privacy-rail b {
  font-size: 17px;
  font-weight: 650;
}

.templates-section {
  border-top-color: var(--soft-line);
}

.landing-template-grid {
  gap: 22px;
  padding-top: 54px;
}

.template-image {
  border-color: var(--line);
  background: #fff;
}

.template-image::after {
  content: "View";
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  color: var(--muted);
  border-top: 1px solid var(--soft-line);
  border-left: 1px solid var(--soft-line);
  padding: 7px 9px;
  letter-spacing: .06em;
}

.template-meta {
  padding-top: 14px;
}

.template-meta .n {
  color: var(--muted);
}

.template-meta h3 {
  font-size: 18px;
  font-weight: 650;
}

/* CTA becomes calm editorial closure instead of a black poster */
.cta {
  background: var(--surface-2);
  color: var(--ink);
  border-top: 1px solid var(--soft-line);
  padding-top: clamp(94px, 10vw, 150px);
}

.cta .section-no {
  color: var(--muted);
}

.cta-title {
  grid-column: 3 / 13;
  font-size: clamp(48px, 7vw, 104px);
  line-height: .9;
  letter-spacing: -.06em;
  font-weight: 700;
}

.cta-bottom {
  grid-column: 3 / 13;
  border-top-color: var(--line);
}

.cta-bottom p {
  color: var(--muted);
}

.cta .btn.dark {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.footer {
  background: var(--surface-2);
  color: var(--ink);
  border-top-color: var(--line);
}

.footer p {
  color: var(--muted);
}

/* App shell: quiet workspace, not a framed dashboard */
.app-shell {
  grid-template-columns: 242px minmax(0, 1fr);
}

.sidebar {
  border-right-color: var(--soft-line);
  background: var(--surface);
}

.sidebar-head {
  padding: 26px 22px;
  border-bottom-color: var(--soft-line);
}

.sidebar-body {
  padding: 28px 14px;
  gap: 34px;
}

.new-resume-side {
  min-height: 42px;
  border: 0;
  border-radius: 2px;
  padding-inline: 14px;
  background: var(--ink);
  letter-spacing: .04em;
}

.side-link {
  min-height: 42px;
  border: 0;
  border-radius: 2px;
  color: var(--muted);
  font-weight: 600;
}

.side-link .idx {
  color: #aaa79d;
}

.side-link.active {
  border: 0;
  background: var(--surface-2);
  color: var(--ink);
}

.side-link.active .idx {
  color: var(--accent);
}

.side-link.active .arr {
  color: var(--muted);
}

.sidebar-foot {
  border-top-color: var(--soft-line);
  padding: 16px;
}

.app-topbar {
  height: 72px;
  border-bottom-color: var(--soft-line);
  background: color-mix(in srgb, var(--paper) 96%, transparent);
}

.crumb .page-num {
  color: var(--muted);
}

.crumb h1 {
  font-weight: 650;
  letter-spacing: .05em;
}

.app-content {
  padding: clamp(40px, 5vw, 74px);
}

.page-intro {
  grid-template-columns: minmax(0, 1.7fr) minmax(280px, .8fr);
  gap: 64px;
  padding-bottom: 42px;
  border-bottom-color: var(--line);
  margin-bottom: 42px;
}

.page-intro h2 {
  font-size: clamp(42px, 5vw, 70px);
  line-height: .96;
  letter-spacing: -.052em;
  font-weight: 700;
}

.page-intro p {
  line-height: 1.65;
}

/* Search / toolbar */
.toolbar {
  margin-bottom: 42px;
}

.search {
  width: min(100%, 460px);
}

.search input {
  height: 42px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding-left: 0;
  border-radius: 0;
}

.search input:focus {
  box-shadow: inset 0 -2px 0 var(--ink);
}

.search .key {
  border-color: var(--soft-line);
  background: var(--surface);
}

/* Documents feel like an archive of paper objects */
.documents-grid {
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
  border: 0;
}

.document-card {
  min-height: 205px;
  border: 1px solid var(--soft-line);
  border-radius: 3px;
  padding: 20px;
  background: var(--surface);
}

.document-card::before {
  width: 3px;
  height: 24px;
  left: -1px;
  top: 18px;
  background: var(--accent);
}

.doc-name {
  font-size: 20px;
  font-weight: 650;
  line-height: 1.12;
}

.doc-menu {
  border-color: var(--soft-line);
  border-radius: 2px;
  color: var(--muted);
}

.doc-footer {
  border-top-color: var(--soft-line);
}

.doc-open {
  font-weight: 700;
  color: var(--ink);
}

/* Template page */
.app-template-grid {
  gap: 40px 24px;
}

.app-template-card .template-image {
  border-color: var(--soft-line);
  box-shadow: 0 12px 34px rgba(23,23,19,.04);
}

.template-actions {
  border-top-color: var(--soft-line);
}

.template-actions button {
  color: var(--muted);
}

/* Settings: spacious reading column */
.settings-layout {
  grid-template-columns: 190px minmax(0, 720px);
  gap: clamp(52px, 8vw, 120px);
}

.settings-nav {
  border-top-color: var(--line);
}

.settings-nav button {
  border-bottom-color: var(--soft-line);
  padding-block: 15px;
  color: var(--muted);
}

.settings-nav span:first-child {
  color: #aaa79d;
}

.settings-panel {
  border-top-color: var(--line);
}

.settings-section {
  padding-block: 38px;
  border-bottom-color: var(--line);
}

.settings-section-head {
  grid-template-columns: minmax(0, 1fr) minmax(240px, .9fr);
  margin-bottom: 32px;
}

.settings-section-head h3 {
  font-size: 24px;
  font-weight: 650;
}

.settings-section-head p {
  line-height: 1.6;
}

.setting-row,
.data-action {
  padding-block: 21px;
  border-top-color: var(--soft-line);
  border-bottom-color: var(--soft-line);
}

.segmented {
  border-color: var(--line);
  border-radius: 2px;
  overflow: hidden;
}

.segmented button {
  border-right-color: var(--line);
  color: var(--muted);
}

.segmented button.active {
  background: var(--ink);
  color: var(--paper);
}

.switch {
  border-color: var(--line);
  border-radius: 999px;
  padding: 2px;
}

.switch i {
  border-radius: 999px;
}

.danger-box {
  border: 0;
  border-top: 1px solid color-mix(in srgb, var(--danger) 38%, var(--line));
  border-bottom: 1px solid color-mix(in srgb, var(--danger) 38%, var(--line));
  padding: 20px 0;
}

/* Dialogs / toast: restrained utility layer */
.modal {
  border-color: var(--line);
  border-radius: 3px;
  box-shadow: 0 28px 80px rgba(23,23,19,.16);
}

.modal-top,
.modal-foot {
  border-color: var(--soft-line);
}

.preview-body {
  background: var(--surface-2);
}

.form-field input {
  border-color: var(--line);
  border-radius: 2px;
}

.choice {
  border-color: var(--soft-line);
  background: var(--surface);
  border-radius: 2px;
}

.choice.active {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  box-shadow: inset 0 -2px 0 var(--accent);
}

.toast {
  border-color: var(--line);
  border-radius: 2px;
  box-shadow: 0 14px 38px rgba(23,23,19,.09);
  background: var(--surface);
}

/* Dark mode keeps the same quiet hierarchy */
[data-theme="dark"] {
  --paper: #151512;
  --surface: #1a1a17;
  --surface-2: #20201c;
  --ink: #eeece4;
  --muted: #a29f95;
  --line: #393831;
  --soft-line: #2b2a26;
  --accent: #dc6859;
}

@media(max-width:1000px) {
  .app-shell { grid-template-columns: 82px minmax(0,1fr); }
}

@media(max-width:900px) {
  .section-heading { grid-column: 3 / 10; }
  .section-intro { grid-column: 10 / 13; }
  .feature-list, .privacy-rail { grid-column: 3 / 13; }
  .cta-title, .cta-bottom { grid-column: 3 / 13; }
  .page-intro { gap: 28px; }
}

@media(max-width:650px) {
  .section-no {
    grid-column: 1 / 13;
    margin-bottom: 22px;
  }
  .section-heading, .section-intro, .feature-list, .privacy-rail {
    grid-column: 1 / 13;
  }
  .section-heading { font-size: 40px; }
  .privacy-rail { grid-template-columns: 1fr; }
  .privacy-rail div,
  .privacy-rail div + div {
    padding-inline: 0;
    border-right: 0;
    border-bottom: 1px solid var(--soft-line);
  }
  .privacy-rail div:last-child { border-bottom: 0; }
  .cta-title, .cta-bottom { grid-column: 1 / 13; }
  .app-content { padding: 32px 18px; }
  .page-intro { padding-bottom: 30px; margin-bottom: 32px; }
}
</style>


<style id="landing-responsive-layout-pass">
/*
  Landing-page responsive layout pass only.
  No art-direction changes - this only recomposes the existing Swiss Editorial layout.
*/

/* Tablet: stop treating the 12-col desktop composition as sacred. */
@media (min-width: 651px) and (max-width: 980px) {
  .header-inner {
    grid-template-columns: 1fr auto;
  }

  .hero {
    padding-top: 64px;
  }

  .hero-meta {
    grid-column: 1 / 4;
    margin-bottom: 0;
  }

  .hero-title {
    grid-column: 4 / 13;
    font-size: clamp(58px, 9.6vw, 88px);
  }

  .hero-copy {
    grid-column: 4 / 9;
    margin-top: 48px;
  }

  .hero-facts {
    grid-column: 9 / 13;
    margin-top: 48px;
  }

  .hero-actions {
    grid-column: 4 / 13;
  }

  .showcase-inner {
    min-height: 610px;
  }

  .showcase-label {
    grid-column: 1 / 4;
  }

  .doc-stage {
    grid-column: 4 / 13;
    min-height: 520px;
  }

  .paper-card {
    width: min(37vw, 330px);
  }

  .paper-a { left: -2%; }
  .paper-b { left: 27%; }
  .paper-c { left: 56%; }

  .section-heading {
    grid-column: 3 / 9;
  }

  .section-intro {
    grid-column: 9 / 13;
  }

  .feature-list,
  .privacy-rail {
    grid-column: 3 / 13;
  }

  .landing-template-grid {
    grid-template-columns: repeat(5, minmax(250px, 1fr));
    padding-right: 32px;
    padding-left: 32px;
  }

  .cta-title,
  .cta-bottom {
    grid-column: 3 / 13;
  }
}

/* Phone: recompose the page into a clear editorial reading order. */
@media (max-width: 650px) {
  .wrap {
    padding-inline: 18px;
  }

  /* Masthead */
  .header-inner {
    min-height: 62px;
    grid-template-columns: 1fr auto;
    gap: 12px;
  }

  .header .brand {
    font-size: 18px;
  }

  .header .icon-btn {
    width: 38px;
    min-height: 38px;
  }

  /* Hero */
  .hero {
    padding-top: 34px;
  }

  .hero > .wrap.grid {
    display: block;
  }

  .hero-meta {
    width: 100%;
    margin: 0 0 34px;
    padding-top: 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
  }

  .hero-meta .eyebrow {
    margin-top: 0 !important;
    text-align: right;
  }

  .hero-title {
    width: 100%;
    font-size: clamp(50px, 14.2vw, 64px);
    line-height: .91;
    letter-spacing: -.061em;
  }

  .hero-title .line-mask {

    </div>
   </main>

   <aside className="builder-preview" aria-label="Resume preview">
    <div className="preview-shell">
     <div className="preview-header">
      <div className="preview-header-left">
       <button className="preview-tool" onClick=${()=>setTemplatesOpen(true)}>Templates</button>
       <span className="eyebrow">${templateInfo[0]}</span>
      </div>
      <div className="preview-header-right">
       <button className="preview-tool" onClick=${()=>toast("Preview refreshed")}>↻</button>
       <button className="preview-tool primary" onClick=${()=>toast("Prototype: PDF export would download here")}>Download PDF ↓</button>
      </div>
     </div>

     <div className="preview-canvas">
      <${motion.article}
       key=${template}
       className=${"resume-sheet live-"+template.toLowerCase()}
       initial=${{opacity:0,scale:.992,y:8}}
       animate=${{opacity:1,scale:1,y:0}}
       transition=${{duration:.28,ease}}
      >
       <div className="resume-inner">
        <header className="resume-header">
         <h1 className="resume-name">${data.name || "Your Name"}</h1>
         <div className="resume-role">${data.role || "Job title"}</div>
         <div className="resume-contactline">${[data.email,data.phone,data.location].filter(Boolean).join(" · ")}</div>
        </header>
        <div className="resume-content">
         <aside className="resume-aside">
          <section className="resume-section"><h3>Contact</h3><p>${data.email}<br/>${data.phone}<br/>${data.location}</p></section>
          <section className="resume-section"><h3>Skills</h3><p>${data.skills}</p></section>
         </aside>
         <main className="resume-main">
          <section className="resume-section"><h3>Profile</h3><p>${data.summary}</p></section>
          <section className="resume-section"><h3>Experience</h3><div className="resume-item"><div className="resume-item-head"><strong>${data.jobTitle}</strong><span>${data.dates}</span></div><div className="resume-item-title">${data.company}</div><p className="resume-item-desc">${data.experience}</p></div></section>
          <section className="resume-section"><h3>Education</h3><div className="resume-item"><div className="resume-item-head"><strong>${data.degree}</strong><span>${data.educationDates}</span></div><div className="resume-item-title">${data.school}</div></div></section>
         </main>
        </div>
       </div>
      </${motion.article}>
     </div>

     <div className="preview-footer">
      <button onClick=${()=>toast("Page 1 of 1")}>1 / 1</button>
      <button onClick=${()=>toast("Zoom decreased")}>−</button>
      <span>100%</span>
      <button onClick=${()=>toast("Zoom increased")}>＋</button>
     </div>

     <${AnimatePresence}>
      ${templatesOpen&&html`<${motion.div} className="builder-template-panel" initial=${{x:"100%",opacity:.6}} animate=${{x:0,opacity:1}} exit=${{x:"100%",opacity:.6}} transition=${{duration:.28,ease}}>
       <div className="builder-template-panel-head"><div><div className="eyebrow">Document style</div><h2>Templates</h2></div><button className="modal-close" onClick=${()=>setTemplatesOpen(false)}>×</button></div>
       <div className="builder-template-options">
        ${templates.map((t,i)=>html`<${motion.button} className=${"builder-template-option "+(template===t[0]?"active":"")} key=${t[0]} onClick=${()=>selectTemplate(t[0])} whileTap=${{scale:.99}}><span className="picker-icon"><${LayoutTemplate} size=${15} strokeWidth=${1.65}/></span><span><strong>${t[0]}</strong><small>${t[1]}</small></span><span className="check">${template===t[0]?html`<${Check} size=${15} strokeWidth=${1.9}/>`:null}</span></${motion.button}>`)}
       </div>
      </${motion.div}>`}
     </${AnimatePresence}>
    </div>
   </aside>
  </div>

  <div className="builder-mobile-toggle" aria-label="Builder view">
   <button className=${mobileView==="editor"?"active":""} onClick=${()=>setMobileView("editor")}>Edit</button>
   <button className=${mobileView==="preview"?"active":""} onClick=${()=>setMobileView("preview")}>Preview</button>
  </div>
 </div>`
}

function App(){
 const[theme,setTheme]=useState("light"),[route,setRoute]=useState(location.hash.replace("#/","")||"home"),[selectedTemplate,setSelectedTemplate]=useState(null),[createOpen,setCreateOpen]=useState(false),[docs,setDocs]=useState(docsSeed),[toastText,setToastText]=useState("");
 useEffect(()=>{const h=()=>setRoute(location.hash.replace("#/","")||"home");addEventListener("hashchange",h);return()=>removeEventListener("hashchange",h)},[]);
 useEffect(()=>{if(toastText){const id=setTimeout(()=>setToastText(""),2200);return()=>clearTimeout(id)}},[toastText]);
 useEffect(()=>{document.documentElement.dataset.theme=theme==="dark"?"dark":"light"},[theme]);
 const {scrollYProgress}=useScroll(),progress=useSpring(scrollYProgress,{stiffness:120,damping:26,mass:.25});
 const create=(title,template)=>{setDocs([{id:Date.now(),title,template,updated:"Just now"},...docs]);setCreateOpen(false);setToastText("Resume created locally");location.hash="#/documents"};
 let page=route==="documents"?html`<${DocumentsPage} docs=${docs} setDocs=${setDocs} theme=${theme} setTheme=${setTheme} setCreateOpen=${setCreateOpen} toast=${setToastText}/>`:route==="templates"?html`<${TemplatesPage} theme=${theme} setTheme=${setTheme} setCreateOpen=${setCreateOpen} setSelectedTemplate=${setSelectedTemplate}/>`:route==="settings"?html`<${SettingsPage} theme=${theme} setTheme=${setTheme} setCreateOpen=${setCreateOpen} toast=${setToastText}/>`:route==="builder"?html`<${BuilderPagePrototype} theme=${theme} setTheme=${setTheme} toast=${setToastText}/>`:html`<${Landing} theme=${theme} setTheme=${setTheme} setSelectedTemplate=${setSelectedTemplate}/>`;
 return html`<${MotionConfig} reducedMotion="user"><div className="site"><${motion.div} className="progress" style=${{scaleX:progress}}/><${AnimatePresence} mode="wait"><${motion.div} key=${route} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${{duration:.22}}>${page}</${motion.div}></${AnimatePresence}><${TemplateModal} selected=${selectedTemplate} onClose=${()=>setSelectedTemplate(null)}/><${CreateResumeModal} open=${createOpen} onClose=${()=>setCreateOpen(false)} onCreate=${create}/><${AnimatePresence}>${toastText&&html`<${motion.div} className="toast" initial=${{opacity:0,y:18}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:12}} transition=${{duration:.22,ease}}>${toastText}</${motion.div}>`}</${AnimatePresence}></div></${MotionConfig}>`
}
createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
